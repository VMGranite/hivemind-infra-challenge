name: Build and Deploy Infra

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: plan
        type: choice
        options: [init, plan, apply]

permissions:
  id-token: write 
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  build:
    name: Build & Vet Go App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o greeter greeter.go

  terraform:
    name: Terraform (${{ inputs.action || 'plan' }})
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log('aud:', payload.aud);
            console.log('sub:', payload.sub);

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config=backend-configs/dev.hcl

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -var-file=environments/dev.tfvars

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var-file=environments/dev.tfvars
